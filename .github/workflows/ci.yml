# Name of the GitHub Actions workflow displayed in the GitHub repository UI.
# اسم مسار العمل (Workflow) الذي يظهر في واجهة مستودع GitHub.
name: Advanced CI & Trigger Conditions

# Defines the events (triggers) that activate this workflow.
# Defines when this workflow should run.
# يحدد الأحداث (Triggers) التي تقوم بتنشيط مسار العمل هذا.
on:
  # Triggers when code is pushed to specific branches.
  # يتم التشغيل عند رفع الكود (Push) إلى فروع محددة.
  push:
    branches: [ "master", "develop", ci_cd ]

  # Triggers on any Pull Request created between any branches.
  # يتم التشغيل عند إنشاء أي Pull Request (PR) بين أي فروع.
  # Only these PR events trigger the workflow:
  # opened       → PR created
  # synchronize  → new commits pushed to the PR
  # reopened     → closed PR opened again
  pull_request:
    types: [opened, synchronize, reopened] # Runs when PR is opened, updated, or reopened

  # Allows manual triggering from the GitHub Actions tab with optional inputs.
  # Allows you to manually run the workflow from: ==>  GitHub
  # 1- → Actions
  # 2- → Workflow
  # 3- → Run workflow
  # يتيح التشغيل اليدوي من تبويب Actions في GitHub مع خيارات إدخال اختيارية.
  workflow_dispatch:
    inputs:
      build_environment:
        description: 'Select Environment / Build Variant (debug, staging, release)'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - staging
          - release

# Defines the jobs executed by the workflow.
# يحدد المهام التي سيتم تنفيذها بواسطة مسار العمل.
jobs:
  # job id build-and-lint is the job ID you define yourself in the YAML file.
  build-and-lint:
    # This is the friendly job name shown in GitHub Actions.
    # GitHub
    #   ↓
    # Create Ubuntu machine
    #   ↓
    # Run your steps
    #   ↓
    # Destroy machine
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code.
      # Your Android project exists on runner
      # الخطوة 1: سحب كود المصدر الخاص بالمستودع.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK) version 21.
      # الخطوة 2: إعداد حزمة تطوير جافا (JDK) الإصدار 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Step 3: Grant executable permissions to Gradle wrapper.
      # الخطوة 3: منح صلاحيات التنفيذ لـ Gradle wrapper.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 3.5: Create local.properties for Secrets Gradle Plugin & Base URL.
      # الخطوة 3.5: إنشاء ملف local.properties لكونه مطلوباً بواسطة Secrets Gradle Plugin.
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "BASE_URL=https://api.example.com" >> local.properties

      # Step 4: Conditional check of the trigger type and print debug info.
      # الخطوة 4: التحقق الشرطي من نوع الـ Trigger وطباعة معلومات التصحيح.
      - name: Check and Log Trigger Conditions
        run: |
          echo "=========================================="
          echo "Workflow triggered by event: ${{ github.event_name }}"
          echo "Branch or Ref: ${{ github.ref }}"
          echo "Triggered by user: ${{ github.actor }}"
          echo "=========================================="

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "-> Condition Met: This is a Pull Request!"
            echo "   Source Branch: ${{ github.head_ref }}"
            echo "   Target Branch: ${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "-> Condition Met: This is a direct push to ${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "-> Condition Met: This was triggered MANUALLY from GitHub UI!"
            echo "   Selected Environment: ${{ inputs.build_environment }}"
          fi

      # Step 5: Run ktlintCheck to validate code style against .editorconfig.
      # الخطوة 5: تشغيل فحص ktlint للتحقق من تنسيق الكود مقابل قواعد .editorconfig.
      - name: Run ktlint check
        run: ./gradlew ktlintCheck

      # Step 6: Run Unit Tests for the selected build variant.
      # الخطوة 6: تشغيل الاختبارات الأحادية (Unit Tests) للبيئة المحددة.
      - name: Run Unit Tests
        run: |
          BUILD_ENV="${{ inputs.build_environment || 'debug' }}"
          echo "=========================================="
          echo "Running Unit Tests for Variant: $BUILD_ENV"
          echo "=========================================="

          case "$BUILD_ENV" in
            staging)
              ./gradlew testStagingUnitTest
              ;;
            release)
              ./gradlew testReleaseUnitTest
              ;;
            *)
              ./gradlew testDebugUnitTest
              ;;
          esac

      # Step 7: Build Selected Environment (debug, staging, or release).
      # الخطوة 7: بناء البيئة المحددة (debug أو staging أو release).
      - name: Build Selected Environment
        run: |
          BUILD_ENV="${{ inputs.build_environment || 'debug' }}"
          echo "=========================================="
          echo "Building Android App Variant: $BUILD_ENV"
          echo "=========================================="

          case "$BUILD_ENV" in
            staging)
              ./gradlew assembleStaging
              ;;
            release)
              ./gradlew assembleRelease
              ;;
            *)
              ./gradlew assembleDebug
              ;;
          esac

      # Step 8: Upload Unit Test Reports as an Artifact.
      # الخطوة 8: رفع تقارير الاختبارات الأحادية كملف مرفق (Artifact).
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
